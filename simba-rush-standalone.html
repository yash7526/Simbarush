<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>SIMBA — Rickshaw Rush · Inverted Energy</title>
  <meta name="description" content="Drive. Charge. Transform. Play SIMBA — Rickshaw Rush, the e-rickshaw mini-game by Inverted Energy.">
  <meta name="theme-color" content="#1B3A62">
  <!-- Optional display font. The game falls back to system fonts if this can't load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
/* =========================================================
   SIMBA — RICKSHAW RUSH  ·  Inverted Energy
   All rules are scoped under .simba-rush so the game can be
   dropped into any page without leaking styles.
   ========================================================= */

.simba-rush {
  --ie-blue: #1B3A62;
  --ie-blue-deep: #0f2440;
  --ie-red: #DB212A;
  --ie-yellow: #FFC928;
  --ie-cyan: #5fe1ff;
  --ink: #ffffff;
  --glass: rgba(15, 36, 64, 0.62);
  --font-display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Baloo 2", "Segoe UI", system-ui, -apple-system, sans-serif;

  position: relative;
  width: 100%;
  height: 100%;
  min-height: 320px;
  overflow: hidden;
  background: var(--ie-blue-deep);
  color: var(--ink);
  font-family: var(--font-ui);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  contain: layout paint;
  isolation: isolate;
}
.simba-rush *, .simba-rush *::before, .simba-rush *::after { box-sizing: border-box; }

.simba-rush canvas.sr-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ---------------- HUD ---------------- */
.sr-hud {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0; transition: opacity .35s ease;
}
.simba-rush.is-playing .sr-hud { opacity: 1; }

.sr-top {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: clamp(10px, 2.2vmin, 22px) clamp(12px, 2.6vmin, 28px);
  gap: 12px;
}
.sr-label {
  font-size: clamp(10px, 1.5vmin, 13px);
  letter-spacing: .18em; font-weight: 700;
  opacity: .85; text-transform: uppercase;
  text-shadow: 0 1px 3px rgba(0,0,0,.5);
}
.sr-score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(26px, 5.4vmin, 54px);
  line-height: .95;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 rgba(0,0,0,.25), 0 4px 18px rgba(0,0,0,.35);
}
.sr-cells { display: flex; gap: 6px; margin-top: 8px; }
.sr-cell {
  width: clamp(18px, 3vmin, 26px); height: clamp(10px, 1.6vmin, 14px);
  border-radius: 3px; position: relative;
  background: #52e07a;
  border: 2px solid rgba(255,255,255,.9);
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
  transition: background .2s, opacity .2s, transform .25s;
}
.sr-cell::after {
  content: ""; position: absolute; right: -5px; top: 50%;
  width: 3px; height: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,.9); border-radius: 0 2px 2px 0;
}
.sr-cell.is-empty { background: rgba(0,0,0,.35); opacity: .6; transform: scale(.9); }
.sr-cells.is-low .sr-cell:not(.is-empty) { background: var(--ie-red); animation: sr-blink .6s infinite alternate; }

.sr-power { text-align: right; min-width: clamp(150px, 30vmin, 260px); }
.sr-power-row { display: flex; align-items: center; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.sr-bar {
  position: relative; flex: 1; height: clamp(14px, 2.4vmin, 20px);
  border-radius: 999px; overflow: hidden;
  background: rgba(10, 22, 40, .55);
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
}
.sr-bar-fill {
  position: absolute; inset: 0;
  transform-origin: left center; transform: scaleX(0);
  background: linear-gradient(90deg, #2f7bff, var(--ie-cyan) 55%, var(--ie-yellow));
  transition: transform .18s ease-out;
}
.sr-bar::after { /* segment ticks */
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 2px), rgba(15,36,64,.55) calc(20% - 2px) 20%);
}
.sr-pct {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(14px, 2.6vmin, 22px); min-width: 3.2em; text-align: right;
  font-variant-numeric: tabular-nums;
}
.sr-ready {
  margin-top: 8px; display: inline-block;
  font-weight: 800; font-size: clamp(11px, 1.8vmin, 15px); letter-spacing: .08em;
  padding: 4px 12px; border-radius: 999px;
  background: var(--ie-yellow); color: var(--ie-blue-deep);
  box-shadow: 0 0 0 0 rgba(255,201,40,.7);
  animation: sr-pulse 1s infinite;
  visibility: hidden;
}
.sr-power.is-ready .sr-ready { visibility: visible; }
.sr-power.is-ready .sr-bar { border-color: var(--ie-yellow); box-shadow: 0 0 16px rgba(255,201,40,.85); }
.sr-power.is-active .sr-bar-fill { background: linear-gradient(90deg, var(--ie-yellow), #fff3a8); }

.sr-mode {
  position: absolute; left: 50%; top: clamp(70px, 11vmin, 110px);
  transform: translateX(-50%) scale(.6);
  opacity: 0; transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);
  display: flex; align-items: center; gap: 10px;
  padding: 6px 18px 6px 8px; border-radius: 999px;
  background: linear-gradient(90deg, rgba(27,58,98,.92), rgba(27,58,98,.75));
  border: 2px solid var(--ie-yellow);
  box-shadow: 0 0 24px rgba(255,201,40,.55);
  white-space: nowrap;
}
.sr-mode img { height: clamp(34px, 6vmin, 52px); width: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
.sr-mode b { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(15px, 2.8vmin, 24px); color: var(--ie-yellow); line-height: 1; }
.sr-mode span { display: block; font-weight: 800; font-size: clamp(11px, 1.8vmin, 15px); letter-spacing: .12em; }
.simba-rush.is-power .sr-mode { opacity: 1; transform: translateX(-50%) scale(1); }

.sr-icons { position: absolute; right: clamp(10px, 2vmin, 20px); bottom: clamp(10px, 2vmin, 20px); display: flex; gap: 8px; pointer-events: auto; }
.simba-rush.is-touch .sr-icons { top: auto; bottom: auto; top: clamp(96px, 15vmin, 130px); }

/* ------------- icon buttons (mute / pause) ------------- */
.sr-iconbtn {
  width: 40px; height: 40px; border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,.4);
  background: var(--glass); color: #fff;
  display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  transition: transform .15s, background .2s;
  padding: 0;
}
.sr-iconbtn:hover { background: rgba(27,58,98,.9); }
.sr-iconbtn:active { transform: scale(.92); }
.sr-iconbtn svg { width: 20px; height: 20px; }
.sr-iconbtn .off { display: none; }
.sr-iconbtn.is-muted .on { display: none; }
.sr-iconbtn.is-muted .off { display: block; }
.sr-mute-global { position: absolute; top: clamp(10px, 2vmin, 20px); right: clamp(10px, 2vmin, 20px); z-index: 6; }
.simba-rush.is-playing .sr-mute-global { display: none; }

/* ------------- touch controls ------------- */
.sr-touch {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 clamp(12px, 3vmin, 28px) max(clamp(12px, 3vmin, 26px), env(safe-area-inset-bottom));
  display: none; justify-content: space-between; align-items: flex-end;
  pointer-events: none;
}
.simba-rush.is-touch.is-playing .sr-touch { display: flex; }
.sr-tbtn {
  pointer-events: auto;
  width: clamp(68px, 19vmin, 104px); height: clamp(68px, 19vmin, 104px);
  border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,.75);
  background: rgba(15,36,64,.45);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(0,0,0,.3);
  transition: transform .08s, background .12s;
  touch-action: none;
}
.sr-tbtn svg { width: 42%; height: 42%; }
.sr-tbtn.is-down { transform: scale(.9); background: rgba(27,58,98,.85); }
.sr-tbtn-power {
  width: clamp(84px, 23vmin, 128px); height: clamp(84px, 23vmin, 128px);
  margin-bottom: clamp(18px, 5vmin, 44px);
  background: rgba(15,36,64,.55);
  flex-direction: column; font-weight: 800; font-size: clamp(12px, 3.2vmin, 17px); letter-spacing: .06em;
  display: flex; align-items: center; justify-content: center; gap: 0;
  opacity: .55;
  position: relative; overflow: hidden;
}
.sr-tbtn-power .sr-tfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(0deg, rgba(95,225,255,.55), rgba(95,225,255,.15)); transition: height .2s; }
.sr-tbtn-power svg, .sr-tbtn-power span { position: relative; }
.sr-tbtn-power svg { width: 38%; height: 38%; }
.sr-tbtn-power.is-ready { opacity: 1; border-color: var(--ie-yellow); background: rgba(219,33,42,.85); animation: sr-pulse 1s infinite; }
.sr-tbtn-power.is-ready .sr-tfill { display: none; }

/* ---------------- screens ---------------- */
.sr-screen {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity .4s ease, visibility 0s linear .4s;
  overflow: hidden;
}
.sr-screen.is-on { opacity: 1; visibility: visible; transition: opacity .4s ease; }

.sr-start {
  background:
    radial-gradient(120% 80% at 70% 110%, rgba(219,33,42,.35), transparent 60%),
    radial-gradient(90% 70% at 15% 0%, rgba(95,225,255,.18), transparent 60%),
    linear-gradient(160deg, #24508a 0%, var(--ie-blue) 45%, var(--ie-blue-deep) 100%);
}
.sr-start::before { /* skyline */
  content: ""; position: absolute; left: 0; right: 0; bottom: 18%; height: 34%;
  background: var(--skyline) bottom center / auto 100% repeat-x;
  opacity: .22;
}
.sr-start::after { /* road */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18.5%;
  background:
    repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.55) 60px 110px) center 52% / 100% 5px no-repeat,
    linear-gradient(#3a3f4a, #23272f);
  border-top: 6px solid;
  border-image: repeating-linear-gradient(90deg, #111 0 26px, var(--ie-yellow) 26px 52px) 6;
}
.sr-start-inner {
  position: relative; z-index: 1;
  width: min(1100px, 100%); height: 100%;
  display: grid; grid-template-columns: 1fr 1.15fr; align-items: center;
  padding: clamp(16px, 4vmin, 48px);
  gap: clamp(8px, 2vmin, 24px);
}
.sr-brand {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: clamp(10px, 1.6vmin, 13px); font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  opacity: .9;
}
.sr-brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--ie-red); display: grid; place-items: center; font-style: normal; }
.sr-brand i svg { width: 14px; height: 14px; }
.sr-title {
  margin: clamp(6px, 1.4vmin, 14px) 0 0;
  font-family: var(--font-display); font-weight: 800;
  line-height: .82; letter-spacing: -.01em;
}
.sr-title .t1 {
  display: block; font-size: clamp(56px, 15vmin, 150px);
  color: #fff;
  text-shadow: 0 4px 0 var(--ie-red), 0 10px 30px rgba(0,0,0,.4);
}
.sr-title .t2 {
  display: block; font-size: clamp(22px, 5.6vmin, 54px);
  color: var(--ie-yellow); letter-spacing: .04em; margin-top: .25em;
  text-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.sr-tag { margin: clamp(8px, 2vmin, 18px) 0 clamp(14px, 3vmin, 28px); font-size: clamp(15px, 2.7vmin, 22px); font-weight: 600; opacity: .95; }
.sr-tag b { color: var(--ie-cyan); font-weight: 700; }

.sr-btn {
  appearance: none; border: 0; cursor: pointer;
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(18px, 3.4vmin, 28px); letter-spacing: .06em;
  color: #fff; background: var(--ie-red);
  padding: .55em 1.6em .45em; border-radius: 999px;
  box-shadow: 0 6px 0 #8f1218, 0 14px 30px rgba(219,33,42,.45);
  transition: transform .12s, box-shadow .12s, filter .2s;
  display: inline-flex; align-items: center; gap: .5em;
}
.sr-btn:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 8px 0 #8f1218, 0 18px 34px rgba(219,33,42,.5); }
.sr-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8f1218, 0 8px 18px rgba(219,33,42,.4); }
.sr-btn:focus-visible { outline: 3px solid var(--ie-yellow); outline-offset: 4px; }
.sr-btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,.7); font-size: clamp(14px, 2.4vmin, 19px); }
.sr-btn.ghost:hover { box-shadow: inset 0 0 0 2px #fff; transform: translateY(-1px); }
.sr-btn.is-loading { opacity: .6; pointer-events: none; }

.sr-howto { margin-top: clamp(14px, 3vmin, 26px); display: flex; gap: 18px; flex-wrap: wrap; font-size: clamp(11px, 1.8vmin, 14px); font-weight: 600; opacity: .9; }
.sr-howto span { display: inline-flex; align-items: center; gap: 6px; }
.sr-key {
  display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 6px;
  border-radius: 6px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.4);
  font-size: .9em; font-weight: 800;
}
.sr-howto .m { display: none; }
.simba-rush.is-touch .sr-howto .d { display: none; }
.simba-rush.is-touch .sr-howto .m { display: inline-flex; }

.sr-hero { position: relative; height: 100%; max-height: 640px; }
.sr-hero .rick {
  position: absolute; right: 0; bottom: 8%; width: 88%;
  filter: drop-shadow(0 22px 22px rgba(0,0,0,.35));
  animation: sr-idle 2.4s ease-in-out infinite;
}
.sr-hero .man {
  position: absolute; left: 2%; bottom: 4%; height: 78%; width: auto;
  filter: drop-shadow(0 18px 18px rgba(0,0,0,.35));
  animation: sr-bob 3s ease-in-out infinite;
}
.sr-hero .glow { position: absolute; left: 10%; right: 0; bottom: 6%; height: 12%; background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.45), transparent 70%); }
.sr-hero .bolt { position: absolute; right: 6%; top: 6%; width: 18%; animation: sr-float 2.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }

/* ----------- game over ----------- */
.sr-over { background: radial-gradient(80% 80% at 50% 40%, rgba(27,58,98,.82), rgba(10,22,40,.94)); }
.sr-card {
  position: relative;
  width: min(460px, 92%);
  max-height: 96%; overflow: visible;
  margin-top: clamp(30px, 6vmin, 56px);
  padding: clamp(18px, 4vmin, 34px) clamp(18px, 4vmin, 34px) clamp(18px, 3.4vmin, 30px);
  border-radius: 28px;
  background: linear-gradient(170deg, rgba(36,80,138,.95), rgba(27,58,98,.97));
  border: 1.5px solid rgba(255,255,255,.22);
  box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);
  text-align: center;
  transform: translateY(20px) scale(.96); transition: transform .45s cubic-bezier(.2,1.4,.4,1);
}
.sr-over.is-on .sr-card { transform: none; }
.sr-card .face { width: clamp(70px, 14vmin, 110px); height: clamp(70px, 14vmin, 110px); margin: calc(-1 * clamp(52px, 10vmin, 80px)) auto 4px; border-radius: 50%; background: var(--ie-yellow); border: 4px solid #fff; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.sr-card .face img { width: 150%; margin-left: -25%; margin-top: 2%; }
.sr-card h2 { margin: 6px 0 2px; font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 5.4vmin, 42px); letter-spacing: .03em; line-height: 1; }
.sr-quip { margin: 0 0 clamp(10px, 2.4vmin, 18px); opacity: .85; font-size: clamp(13px, 2vmin, 16px); font-style: italic; }
.sr-bigscore { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 10vmin, 76px); line-height: 1; color: var(--ie-yellow); font-variant-numeric: tabular-nums; text-shadow: 0 4px 0 rgba(0,0,0,.2); }
.sr-newbest { display: none; margin: 6px auto 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; background: var(--ie-red); padding: 3px 10px; border-radius: 999px; width: max-content; }
.sr-newbest.is-on { display: block; animation: sr-pulse 1s infinite; }
.sr-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: clamp(12px, 2.6vmin, 22px) 0; }
.sr-stats div { background: rgba(0,0,0,.18); border-radius: 14px; padding: 8px 4px; }
.sr-stats b { display: block; font-family: var(--font-display); font-size: clamp(18px, 3.4vmin, 26px); font-variant-numeric: tabular-nums; line-height: 1.1; }
.sr-stats small { font-size: 10px; letter-spacing: .16em; font-weight: 700; opacity: .75; }
.sr-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.sr-toast { min-height: 1.2em; margin-top: 8px; font-size: 13px; opacity: .85; }
.sr-foot { margin-top: 12px; font-size: 10px; letter-spacing: .2em; opacity: .55; font-weight: 700; }

/* ----------- pause ----------- */
.sr-pause { background: rgba(10,22,40,.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); flex-direction: column; gap: 18px; text-align: center; }
.sr-pause h3 { margin: 0; font-family: var(--font-display); font-size: clamp(30px, 7vmin, 52px); font-weight: 800; letter-spacing: .06em; }

/* ----------- loading ----------- */
.sr-loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--ie-blue-deep); transition: opacity .4s; }
.sr-loading.is-done { opacity: 0; pointer-events: none; }
.sr-loading div { width: 160px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
.sr-loading div i { display: block; height: 100%; width: 0; background: var(--ie-red); transition: width .2s; }

/* ----------- flash ----------- */
.sr-flash { position: absolute; inset: 0; pointer-events: none; background: #fff; opacity: 0; z-index: 4; }

@keyframes sr-pulse { 0% { box-shadow: 0 0 0 0 rgba(255,201,40,.7); } 100% { box-shadow: 0 0 0 14px rgba(255,201,40,0); } }
@keyframes sr-blink { to { opacity: .45; } }
@keyframes sr-idle { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-.4deg); } }
@keyframes sr-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes sr-float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }

/* ----------- portrait / small ----------- */
@media (max-aspect-ratio: 1/1) {
  .sr-start-inner { grid-template-columns: 1fr; grid-template-rows: auto 1fr; text-align: center; align-items: start; padding-top: clamp(28px, 7vh, 70px); }
  .sr-start-inner > div:first-child { display: flex; flex-direction: column; align-items: center; }
  .sr-howto { justify-content: center; }
  .sr-hero { max-height: none; min-height: 0; }
  .sr-hero .rick { width: 82%; right: 4%; bottom: 14%; }
  .sr-hero .man { height: 74%; bottom: 10%; }
  .sr-start::before { bottom: 14%; }
  .sr-start::after { height: 14.5%; }
}
@media (max-height: 480px) and (min-aspect-ratio: 1/1) {
  .sr-tbtn-power { margin-bottom: 0; width: 76px; height: 76px; }
  .sr-mode { top: 8px; padding: 3px 12px 3px 6px; } .sr-mode img { height: 30px; }
  .sr-card { padding-top: 10px; padding-bottom: 12px; margin-top: 34px; }
  .sr-card .face { width: 64px; height: 64px; margin-top: -42px; }
  .sr-card h2 { font-size: 24px; } .sr-quip { margin-bottom: 4px; } .sr-bigscore { font-size: 40px; }
  .sr-stats { margin: 8px 0; } .sr-actions { flex-direction: row; justify-content: center; } .sr-foot { display: none; }
  .sr-howto { margin-top: 10px; }
  .sr-tag { margin: 6px 0 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .sr-hero .rick, .sr-hero .man, .sr-hero .bolt, .sr-ready, .sr-tbtn-power.is-ready { animation: none; }
}

</style>
  <style>
    html, body { margin: 0; height: 100%; background: #0f2440; overflow: hidden; }
    #simba-rush { width: 100vw; height: 100vh; height: 100dvh; }
  </style>
</head>

<script>
/*!
 * SIMBA — RICKSHAW RUSH
 * A branded endless-driving mini-game for Inverted Energy.
 *
 * Embedding:
 *   <link rel="stylesheet" href="style.css">
 *   <div data-simba-rush data-assets="assets/" style="width:100%;height:600px"></div>
 *   <script src="game.js" defer><\/script>
 * or manually: SimbaRush.mount(element, { assets: 'assets/' })
 *
 * Code map (search for the banners):
 *   CONFIG ........ every tunable number (speed, scoring, power, difficulty)
 *   THEMES ........ palettes per level (add 'night', 'village' ... here)
 *   OBSTACLES ..... obstacle catalogue (size, sprite, unlock time, weight)
 *   SPRITES ....... procedural, pre-rendered canvas art (drawn once, reused)
 *   AUDIO ......... tiny WebAudio synth – no audio files
 *   GAME .......... state machine, update, render
 */
(function (global) {
  'use strict';

  /* =====================================================================
   * CONFIG
   * ===================================================================== */
  const CONFIG = {
    lanes: [-1, 0, 1],
    roadHalf: 1.62,          // world units (lane spacing = 1)
    playerZ: 4,              // depth at which SIMBA sits
    farZ: 72,                // draw distance
    camH: 1,
    playerWidth: 0.84,       // SIMBA width in lane units
    laneSnap: 15,            // lane change responsiveness
    speed: { start: 15, max: 33, rampStart: 8, rampDuration: 105, power: 1.55, hitDrop: 0.45, recover: 1.6 },
    health: 3,
    invuln: 1.6,
    power: { perCell: 20, perCoin: 1, hitPenalty: 15, transform: 1.5, duration: 9, magnetZ: 24 },
    score: { perUnit: 1, coin: 50, destroy: 100, avoid: 25, cell: 20, mult: 2 },
    spawn: { firstRowAt: 34, gapStart: 30, gapEarly: 27, gapMin: 13, gapRamp: 100 },
    energyEvery: [3.6, 5.4], // seconds between energy cells (normal mode)
    maxParticles: 360,
    dprCap: 2,
    storageKey: 'simbaRush.best.v1'
  };

  /* Level themes – only 'city' is active today; add more and switch via game.setTheme(). */
  const THEMES = {
    city: {
      skyTop: '#5fa8e0', skyMid: '#a9d3ee', skyLow: '#ffe3b8',
      haze: 'rgba(255,228,190,', sun: '#fff3c9',
      skyline: ['#9cb1c9', '#7f97b3'],
      ground: ['#c9b597', '#b19c7c'],
      road: ['#7d7f86', '#4d5058', '#3d4047'],
      kerb: ['#1d1d1f', '#f6c21c'],
      line: '#f3f3ee', edge: '#f6c21c'
    }
  };

  /* Obstacle catalogue. w = world width, unlock = seconds before it can appear. */
  const OBSTACLES = {
    car:          { w: 0.9,  sprite: 'car',     unlock: 0,  weight: 5, hp: 1 },
    scooter:      { w: 0.46, sprite: 'scooter', unlock: 0,  weight: 3, weave: true },
    auto:         { w: 0.8,  sprite: 'auto',    unlock: 0,  weight: 4 },
    barricade:    { w: 0.98, sprite: 'barricade', unlock: 5, weight: 2, static: true },
    pothole:      { w: 0.8,  sprite: 'pothole', unlock: 8,  weight: 2, ground: true, len: 1.3 },
    motorcycle:   { w: 0.48, sprite: 'moto',    unlock: 12, weight: 2, weave: true },
    bus:          { w: 1.0,  sprite: 'bus',     unlock: 20, weight: 2 },
    construction: { w: 1.02, sprite: 'works',   unlock: 26, weight: 2, static: true },
    truck:        { w: 1.0,  sprite: 'truck',   unlock: 36, weight: 2 }
  };

  /* =====================================================================
   * UTILS
   * ===================================================================== */
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function shade(hex, amt) { // amt -1..1
    const [r, g, b] = hexToRgb(hex);
    const f = (c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
    return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
  }
  function mk(w, h, fn, scale) {
    scale = scale || 1;
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * scale); c.height = Math.ceil(h * scale);
    const x = c.getContext('2d');
    x.scale(scale, scale);
    fn(x, w, h);
    return c;
  }
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fillRR(ctx, x, y, w, h, r, fill) { rr(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
  function ellipse(ctx, x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
  function vgrad(ctx, y0, y1, stops) {
    const g = ctx.createLinearGradient(0, y0, 0, y1);
    stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s));
    return g;
  }
  function text(ctx, str, x, y, font, color, align) {
    ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function boltPath(ctx, x, y, s) { // lightning bolt centred at x,y, height s
    const k = s / 100;
    ctx.beginPath();
    ctx.moveTo(x + 8 * k, y - 50 * k);
    ctx.lineTo(x - 26 * k, y + 6 * k);
    ctx.lineTo(x - 2 * k, y + 6 * k);
    ctx.lineTo(x - 10 * k, y + 50 * k);
    ctx.lineTo(x + 26 * k, y - 8 * k);
    ctx.lineTo(x + 2 * k, y - 8 * k);
    ctx.closePath();
  }
  const SYS = 'Arial, Helvetica, sans-serif';

  /* =====================================================================
   * SPRITES – procedural art, rendered once into offscreen canvases.
   * Vehicles are drawn from BEHIND (the camera follows SIMBA).
   * ===================================================================== */
  const S2 = 2; // supersampling for crisp scaling on hi-dpi
  const Sprites = {};

  function tyres(ctx, xs, y, w, h) {
    xs.forEach((x) => {
      fillRR(ctx, x, y, w, h, 6, '#15171b');
      fillRR(ctx, x + 3, y + 3, w - 6, 5, 3, 'rgba(255,255,255,.08)');
    });
  }
  function plate(ctx, x, y, w, h, yellow, str) {
    fillRR(ctx, x, y, w, h, 3, yellow ? '#ffd21a' : '#f4f4ef');
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2; rr(ctx, x + 1, y + 1, w - 2, h - 2, 2); ctx.stroke();
    text(ctx, str, x + w / 2, y + h / 2 + 0.5, 'bold ' + Math.round(h * 0.55) + 'px ' + SYS, '#111');
  }
  function tail(ctx, x, y, w, h) {
    fillRR(ctx, x, y, w, h, 5, '#8c0f14');
    fillRR(ctx, x + 2, y + 2, w - 4, h - 4, 4, vgrad(ctx, y, y + h, ['#ff5a4f', '#d3141c']));
    fillRR(ctx, x + 4, y + 3, (w - 8) * 0.5, 3, 2, 'rgba(255,255,255,.55)');
  }

  function drawCar(color, kind) {
    return mk(220, 172, (c) => {
      ellipse(c, 110, 164, 106, 8, 'rgba(0,0,0,.32)');
      tyres(c, [14, 170], 128, 36, 38);
      const top = kind === 'hatch' ? 10 : 22;
      // cabin
      c.beginPath();
      c.moveTo(26, 86); c.lineTo(46, top + 10); c.quadraticCurveTo(50, top, 64, top);
      c.lineTo(156, top); c.quadraticCurveTo(170, top, 174, top + 10); c.lineTo(194, 86); c.closePath();
      c.fillStyle = vgrad(c, top, 86, [shade(color, 0.15), shade(color, -0.1)]); c.fill();
      // glass
      c.beginPath();
      c.moveTo(38, 80); c.lineTo(53, top + 12); c.lineTo(167, top + 12); c.lineTo(182, 80); c.closePath();
      c.fillStyle = vgrad(c, top, 80, ['#33465a', '#121a24']); c.fill();
      c.save(); c.clip();
      c.fillStyle = 'rgba(255,255,255,.13)';
      c.beginPath(); c.moveTo(70, top); c.lineTo(100, top); c.lineTo(70, 90); c.lineTo(40, 90); c.fill();
      // head-rests inside
      fillRR(c, 64, 52, 30, 26, 8, 'rgba(0,0,0,.35)'); fillRR(c, 126, 52, 30, 26, 8, 'rgba(0,0,0,.35)');
      c.restore();
      // body
      fillRR(c, 6, 76, 208, 72, 20, vgrad(c, 76, 148, [shade(color, 0.12), color, shade(color, -0.3)]));
      fillRR(c, 16, 80, 188, 4, 2, 'rgba(255,255,255,.35)');
      c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(30, 108); c.lineTo(190, 108); c.stroke();
      tail(c, 10, 88, 48, 18); tail(c, 162, 88, 48, 18);
      plate(c, 80, 110, 60, 17, false, 'DL 3C ' + (1000 + ((Math.random() * 8999) | 0)));
      fillRR(c, 8, 132, 204, 16, 8, vgrad(c, 132, 148, ['#2a2c31', '#141518']));
      fillRR(c, 20, 138, 14, 4, 2, '#ff7a3a'); fillRR(c, 186, 138, 14, 4, 2, '#ff7a3a');
    }, S2);
  }

  function drawBus() {
    return mk(240, 282, (c) => {
      ellipse(c, 120, 274, 116, 8, 'rgba(0,0,0,.32)');
      tyres(c, [16, 184], 236, 40, 40);
      fillRR(c, 6, 6, 228, 248, 24, vgrad(c, 6, 254, ['#e04a4f', '#c3242b', '#8e161b']));
      fillRR(c, 6, 6, 228, 30, 20, 'rgba(255,255,255,.18)');
      fillRR(c, 52, 13, 136, 20, 4, '#101114');
      text(c, '534  ISBT', 120, 23.5, 'bold 13px "Courier New", monospace', '#ffa21f');
      fillRR(c, 20, 42, 200, 80, 12, vgrad(c, 42, 122, ['#3b5168', '#121a24']));
      c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.moveTo(60, 42); c.lineTo(100, 42); c.lineTo(60, 122); c.lineTo(20, 122); c.fill();
      // passengers' heads silhouettes
      [40, 78, 150, 186].forEach((x, i) => ellipse(c, x, 108 - (i % 2) * 4, 12, 14, 'rgba(0,0,0,.35)'));
      c.fillStyle = '#ffc928'; c.fillRect(6, 128, 228, 10);
      // brand panel
      fillRR(c, 22, 146, 196, 56, 10, '#1B3A62');
      c.fillStyle = '#DB212A'; boltPath(c, 46, 174, 40); c.fill();
      text(c, 'INVERTED ENERGY', 132, 166, 'bold 15px ' + SYS, '#fff');
      text(c, 'Lithium power · Made in India', 132, 186, '10px ' + SYS, 'rgba(255,255,255,.8)');
      tail(c, 12, 208, 24, 30); tail(c, 204, 208, 24, 30);
      plate(c, 90, 214, 60, 17, true, 'DL 1PC 7781');
      fillRR(c, 8, 238, 224, 14, 6, '#1b1c20');
    }, S2);
  }

  function drawTruck() {

  function drawBuilding(seed) {
    const r = mulberry(seed * 9973 + 11);
    const floors = 1 + ((r() * 3) | 0);
    const W = 260, shopH = 132, fh = 92;
    const H = shopH + floors * fh + 22 + 50;
    return mk(W, H, (c) => {
      const wall = WALLS[(r() * WALLS.length) | 0];
      const base = H - shopH;
      const top = 50;
      c.fillStyle = vgrad(c, top, H, [shade(wall, 0.12), wall, shade(wall, -0.15)]);
      c.fillRect(0, top, W, H - top);
      c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(0, top, 8, H - top); c.fillRect(W - 8, top, 8, H - top);
      // stains
      c.fillStyle = 'rgba(80,60,40,.07)'; for (let i = 0; i < 4; i++) c.fillRect(r() * W, top + r() * (H - top - shopH), 30 + r() * 40, 60);
      // parapet + tank + dish
      c.fillStyle = shade(wall, -0.2); c.fillRect(0, top, W, 12);
      const tx = 30 + r() * 150;
      fillRR(c, tx, 6, 48, 48, 8, '#1f2124'); c.fillStyle = '#34373c';
      for (let y = 14; y < 50; y += 9) c.fillRect(tx + 2, y, 44, 2);
      ellipse(c, tx + 24, 8, 22, 5, '#2a2c30');
      if (r() > 0.4) { const dx = tx > 130 ? 30 : 200; c.strokeStyle = '#ddd'; c.lineWidth = 3; c.beginPath(); c.arc(dx, 36, 14, Math.PI * 0.8, Math.PI * 1.9); c.stroke(); c.fillStyle = '#999'; c.fillRect(dx - 1, 36, 3, 14); }
      // floors
      for (let f = 0; f < floors; f++) {
        const y = top + 22 + f * fh;
        const n = r() > 0.5 ? 3 : 2;
        const ww = n === 3 ? 52 : 70, gap = (W - n * ww) / (n + 1);
        for (let i = 0; i < n; i++) {
          const x = gap + i * (ww + gap);
          fillRR(c, x - 4, y - 4, ww + 8, 66, 4, shade(wall, -0.18));
          fillRR(c, x, y, ww, 58, 3, vgrad(c, y, y + 58, ['#5d7487', '#2c3a47']));
          c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(x + 4, y + 4, ww * 0.3, 50);
          c.strokeStyle = 'rgba(30,30,30,.65)'; c.lineWidth = 2;
          for (let gx = x + 10; gx < x + ww; gx += 12) { c.beginPath(); c.moveTo(gx, y); c.lineTo(gx, y + 58); c.stroke(); }
          c.beginPath(); c.moveTo(x, y + 29); c.lineTo(x + ww, y + 29); c.stroke();
          fillRR(c, x - 8, y - 12, ww + 16, 8, 3, shade(wall, -0.3)); // chajja
        }
        if (r() > 0.45) { // balcony
          c.fillStyle = shade(wall, -0.25); c.fillRect(10, y + 62, W - 20, 8);
          c.strokeStyle = '#333'; c.lineWidth = 2;
          c.beginPath(); c.moveTo(10, y + 40); c.lineTo(W - 10, y + 40); c.stroke();
          for (let x = 14; x < W - 10; x += 10) { c.beginPath(); c.moveTo(x, y + 40); c.lineTo(x, y + 62); c.stroke(); }
          if (r() > 0.4) { // laundry
            c.strokeStyle = '#555'; c.lineWidth = 1; c.beginPath(); c.moveTo(20, y + 8); c.quadraticCurveTo(W / 2, y + 18, W - 20, y + 8); c.stroke();
            const cl = ['#e11d48', '#2563eb', '#fbbf24', '#10b981', '#fff', '#f97316'];
            for (let i = 0; i < 5; i++) { const lx = 36 + i * 42 + r() * 10; c.fillStyle = cl[(r() * cl.length) | 0]; c.fillRect(lx, y + 12, 18 + r() * 8, 22 + r() * 10); }
          }
          ellipse(c, 30, y + 34, 9, 7, '#2f8a3a'); fillRR(c, 24, y + 36, 12, 8, 2, '#b45309');
        }
        if (r() > 0.5) { const ax = r() > 0.5 ? 14 : W - 58; fillRR(c, ax, y + 34, 44, 26, 3, '#e5e7eb'); c.strokeStyle = '#9ca3af'; c.lineWidth = 1.5; for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(ax + 6, y + 39 + i * 4); c.lineTo(ax + 38, y + 39 + i * 4); c.stroke(); } }
      }
      // shop
      const sign = SHOPS[(r() * SHOPS.length) | 0];
      const [a1, a2] = AWN[(r() * AWN.length) | 0];
      fillRR(c, 6, base + 2, W - 12, 32, 4, a1);
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2; rr(c, 9, base + 5, W - 18, 26, 3); c.stroke();
      let fs = 18; c.font = 'bold ' + fs + 'px ' + SYS; while (c.measureText(sign).width > W - 30 && fs > 10) { fs--; c.font = 'bold ' + fs + 'px ' + SYS; }
      text(c, sign, W / 2, base + 19, 'bold ' + fs + 'px ' + SYS, a2);
      // awning
      for (let i = 0; i < 10; i++) {
        c.fillStyle = i % 2 ? a2 : a1;
        c.beginPath(); const x = i * (W / 10);
        c.moveTo(x, base + 34); c.lineTo(x + W / 10, base + 34); c.lineTo(x + W / 10 + 3, base + 56); c.lineTo(x + 3, base + 56); c.fill();
      }
      c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(0, base + 52, W, 4);
      // interior
      c.fillStyle = '#2a211b'; c.fillRect(14, base + 56, W - 28, shopH - 56);
      c.fillStyle = 'rgba(255,214,140,.25)'; c.fillRect(14, base + 56, W - 28, 30);
      const goods = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#fde68a', '#a78bfa'];
      for (let s = 0; s < 3; s++) {

      }
      // shutter (half rolled)
      c.fillStyle = '#9aa1a9'; c.fillRect(14, base + 56, W - 28, 16);
      c.fillStyle = '#7c838c'; for (let y = base + 58; y < base + 72; y += 4) c.fillRect(14, y, W - 28, 1.5);
      // counter
      fillRR(c, 20, H - 30, W - 40, 30, 3, '#8b5e3c'); c.fillStyle = 'rgba(255,255,255,.15)'; c.fillRect(20, H - 30, W - 40, 4);

    });

  function drawSkyline(theme) {
    return mk(1400, 300, (c) => {
      const r = mulberry(42);
      const layer = (col, minH, maxH, y0, density) => {
        c.fillStyle = col;
        let x = 0;
        while (x < 1400) {
          const w = 40 + r() * 90 * density, h = minH + r() * (maxH - minH);
          c.fillRect(x, 300 - h - y0, w, h + y0);
          const t = r();
          if (t < 0.3) { c.fillRect(x + w * 0.2, 300 - h - 16 - y0, 18, 16); } // tank
          else if (t < 0.38) { // temple shikhara
            c.beginPath(); c.moveTo(x + w * 0.2, 300 - h - y0); c.quadraticCurveTo(x + w * 0.5, 300 - h - 90 - y0, x + w * 0.8, 300 - h - y0); c.fill();
            c.fillRect(x + w * 0.5 - 1, 300 - h - 104 - y0, 3, 18);
          } else if (t < 0.44) { // dome + minaret
            c.beginPath(); c.arc(x + w / 2, 300 - h - y0, w * 0.32, Math.PI, 0); c.fill();
            c.fillRect(x + w - 8, 300 - h - 60 - y0, 8, 60); c.beginPath(); c.arc(x + w - 4, 300 - h - 60 - y0, 6, Math.PI, 0); c.fill();
          } else if (t < 0.5) { // tower
            c.fillRect(x + w / 2 - 2, 300 - h - 70 - y0, 4, 70); c.fillRect(x + w / 2 - 10, 300 - h - 60 - y0, 20, 4); c.fillRect(x + w / 2 - 7, 300 - h - 44 - y0, 14, 3);
          }
          x += w + r() * 6;
        }
      };
      layer(theme.skyline[0], 60, 170, 0, 1.2);
      layer(theme.skyline[1], 30, 110, 0, 1);
    });
  }

  /* SIMBA power variants built from the photographic reference sprite. */
  function buildSimbaVariants(img) {
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    const pad = 40;
    const silhouette = (color) => mk(w, h, (c) => { c.drawImage(img, 0, 0); c.globalCompositeOperation = 'source-in'; c.fillStyle = color; c.fillRect(0, 0, w, h); });
    const white = silhouette('#fff');
    const cyan = silhouette('#7fe9ff');
    const glow = mk(w + pad * 2, h + pad * 2, (c) => {
      c.globalAlpha = 0.09;
      for (let rad = 6; rad <= 34; rad += 7) for (let a = 0; a < 12; a++) c.drawImage(cyan, pad + Math.cos(a / 12 * 6.283) * rad, pad + Math.sin(a / 12 * 6.283) * rad);
    });
    const charged = mk(w, h, (c) => { c.drawImage(img, 0, 0); c.globalCompositeOperation = 'source-atop'; const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(255,214,60,.28)'); g.addColorStop(1, 'rgba(80,200,255,.22)'); c.fillStyle = g; c.fillRect(0, 0, w, h); });
    return { white, glow, charged, pad };
  }

      else { spr = pick(this.spr.buildings); w = 2.35; x = side * (2.75 + w / 2); }
      this.scen.push({ kind: 'spr', spr, wz, x, w, layer: 0 });
      this.scenNext[key] = wz + w + rand(0.05, 0.5);
    }
    addProp(side) {
      const key = side < 0 ? 'pL' : 'pR';
      const wz = this.scenNext[key];
      const r = Math.random();
      let spr, w, x = side * 2.0;
      if (r < 0.2) { spr = this.spr.pole; w = 1.0; x = side * 1.98; }
      else if (r < 0.34) { spr = side < 0 ? this.spr.lampR : this.spr.lampL; w = 0.85; x = side * 2.0 + (side < 0 ? 0.32 : -0.32); }
      else if (r < 0.5) { spr = pick(this.spr.trees); w = 1.25; x = side * 2.25; }
      else if (r < 0.72) { spr = pick(this.spr.people); w = 0.24; x = side * rand(1.95, 2.5); }
      else if (r < 0.8) { spr = this.spr.chai; w = 1.0; x = side * 2.3; }
      else if (r < 0.85) { spr = this.spr.cow; w = 0.72; x = side * 2.25; }
      else if (r < 0.9) { spr = this.spr.charger; w = 0.4; x = side * 2.15; }
      else if (r < 0.95) { spr = this.spr.sign; w = 0.95; x = side * 2.2; }
      else { spr = this.spr.speed; w = 0.75; x = side * 1.95; }
      this.scen.push({ kind: 'spr', spr, wz, x, w, layer: 1 });
      this.scenNext[key] = wz + rand(2.2, 5.5);
    }

    /* ---------------- spawning ---------------- */
    gapNow() {
      const s = CONFIG.spawn;
      if (this.time < 10) return s.gapStart;
      return lerp(s.gapEarly, s.gapMin, clamp((this.time - 10) / s.gapRamp, 0, 1));
    }
    pickType() {
      const t = this.time; let total = 0;
      const pool = [];
      for (const k in OBSTACLES) { const o = OBSTACLES[k]; if (o.unlock <= t) { pool.push(k); total += o.weight; } }
      let r = Math.random() * total;
      for (const k of pool) { r -= OBSTACLES[k].weight; if (r <= 0) return k; }
      return pool[0];
    }
    spawnRow() {
      const z0 = CONFIG.farZ + 2;
      const t = this.time;
      const idx = this.rowIndex++;
      let blocked;
      const dbl = t < 15 ? 0 : lerp(0.15, 0.58, clamp((t - 15) / 80, 0, 1));
      if (idx === 0) blocked = [Math.random() < 0.5 ? -1 : 1];
      else if (idx === 1) blocked = [0];
      else {
        const lanes = [-1, 0, 1].sort(() => Math.random() - 0.5);
        blocked = lanes.slice(0, Math.random() < dbl ? 2 : 1);
      }
      const free = [-1, 0, 1].filter((l) => blocked.indexOf(l) < 0);
      blocked.forEach((lane) => {
        const type = idx < 2 ? 'car' : this.pickType();
        const o = OBSTACLES[type];
        const variants = this.spr[o.sprite];
        this.obs.push({
          type, def: o, spr: pick(variants), lane, x: lane, z: z0 + (blocked.length === 1 ? rand(0, 3) : rand(0, 1.2)),
          w: o.w, ground: !!o.ground, len: o.len || 1, state: 'live', passed: false,
          ph: Math.random() * 6, vx: 0, vy: 0, vz: 0, h: 0, rot: 0, vr: 0, alpha: 1, tx: lane, weaving: false
        });
      });
      const gap = this.gapNow();
      const powered = this.mode === 'power' || this.mode === 'transform';
      // coin trail in a free lane – a gentle hint of the safe path
      const coinLane = free.indexOf(this.lastFree) >= 0 && Math.random() < 0.6 ? this.lastFree : pick(free);
      if (Math.random() < (powered ? 1 : 0.8)) {
        const n = powered ? 3 : Math.max(3, Math.min(7, Math.floor(gap * 0.6 / 1.8)));
        for (let i = 0; i < n; i++) this.pick.push({ kind: 'coin', x: coinLane, z: z0 + 2 + gap * 0.2 + i * 1.8, ph: i * 0.5, alive: true });
      }
      if (!powered && this.energyTimer <= 0 && !this.ready) {
        const el = pick(free);
        this.pick.push({ kind: 'cell', x: el, z: z0 + gap * (el === coinLane ? 0.85 : 0.5), ph: 0, alive: true });
        this.energyTimer = rand(CONFIG.energyEvery[0], CONFIG.energyEvery[1]);
      }
      this.lastFree = coinLane;
      this.nextRowAt = this.dist + gap;
    }

    /* ---------------- particles ---------------- */
    spawnP(x, y, vx, vy, life, size, color, add, g, shape) {
      const ps = this.particles;
      for (let i = 0; i < ps.length; i++) {
        const p = ps[i];
        if (p.life <= 0) {
          p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.size = size; p.color = color; p.add = add; p.g = g || 0; p.shape = shape || 'dot';
          return p;
        }
      }
      return null;
    }
    burst(x, y, n, colors, speed, life, size, add, g, shape) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * 6.283, v = rand(speed * 0.3, speed);
        this.spawnP(x, y, Math.cos(a) * v, Math.sin(a) * v - speed * 0.2, rand(life * 0.5, life), rand(size * 0.5, size), pick(colors), add, g, shape);
      }
    }
    addFloater(txt, x, y, color, life, size) {
      const f = this.floaters.find((q) => q.life <= 0) || this.floaters[0];
      f.txt = txt; f.x = x; f.y = y; f.color = color; f.life = f.max = life || 0.9; f.size = size || 26;
    }
    addScore(v, x, y, label, color) {
      const mult = this.mode === 'power' ? CONFIG.score.mult : 1;
      this.score += v * mult;
      if (label !== false && x !== undefined) this.addFloater('+' + v * mult + (label ? ' ' + label : ''), x, y, color || '#fff', 0.9, mult > 1 ? 30 : 26);
    }

    /* ---------------- update ---------------- */
    frame(now) {
      requestAnimationFrame(this.frame);
      let dt = (now - this.last) / 1000; this.last = now;
      if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
      if (this.state === 'playing') this.update(dt);
      else if (this.state === 'menu' || this.state === 'over') this.idle(dt);
      if (this.state !== 'paused' && this.state !== 'loading') this.render(dt);
    }
    idle(dt) {
      // keep the city alive behind menus
      this.dist += 6 * dt; this.time += dt; this.shake = 0;
      this.populateScenery(); this.cullScenery();
      this.updateParticles(dt);
    }
    update(dt) {
      const C = CONFIG;
      // ---- mode machine (uses real dt)
      if (this.mode === 'transform') this.updateTransform(dt);
      else if (this.mode === 'power') {
        this.modeT += dt;
        if (this.modeT >= C.power.duration) this.endPower();
      } else if (this.mode === 'crash') {
        this.crashT += dt; this.timeScale = lerp(this.timeScale, 0.25, dt * 4);
        if (this.crashT > 1.1) { this.gameOver(); return; }
      }
      const wdt = dt * this.timeScale;
      this.time += wdt;

      // ---- speed
      const sp = C.speed;
      const ramp = clamp((this.time - sp.rampStart) / sp.rampDuration, 0, 1);
      const base = lerp(sp.start, sp.max, ramp * (2 - ramp) * 0.5 + ramp * 0.5);
      const targetMul = this.mode === 'power' ? sp.power : 1;
      this.speedMul = lerp(this.speedMul, targetMul, dt * 3);
      this.hitSlow = Math.max(0, this.hitSlow - dt / sp.recover);
      this.speed = base * this.speedMul * (1 - sp.hitDrop * easeOut(this.hitSlow));
      const dz = this.speed * wdt;
      this.dist += dz;
      if (this.mode !== 'crash') this.score += dz * C.score.perUnit * (this.mode === 'power' ? C.score.mult : 1);

      // ---- player
      const kx = 1 - Math.exp(-C.laneSnap * dt);
      const prevX = this.px;
      this.px += (this.lane - this.px) * kx;
      this.tilt = lerp(this.tilt, (this.px - prevX) / Math.max(dt, 1e-4) * 0.045, Math.min(1, dt * 12));
      this.tilt *= 0.92;
      this.bob += wdt * this.speed * 0.55;
      this.camX = lerp(this.camX, this.px * 0.42, Math.min(1, dt * 6));
      this.invuln = Math.max(0, this.invuln - dt);
      this.fovK = lerp(this.fovK, this.mode === 'power' ? 1.07 : 1, dt * 3);
      this.fx = this.fx0 * this.fovK;
      this.shake = Math.max(0, this.shake - dt * 24);
      if (this.flashA > 0) { this.flashA = Math.max(0, this.flashA - dt * 2.6); this.el.flash.style.opacity = this.flashA.toFixed(3); }

      // ---- spawning
      if (this.mode !== 'crash') {
        this.energyTimer -= wdt;
        if (this.dist >= this.nextRowAt) this.spawnRow();
      }
      this.populateScenery(); this.cullScenery();

      // ---- obstacles
      const pz = C.playerZ, phw = C.playerWidth * 0.45;
      const powered = this.mode === 'power' || this.mode === 'transform';
      for (let i = this.obs.length - 1; i >= 0; i--) {
        const o = this.obs[i];
        const pzPrev = o.z;
        if (o.state === 'live') {
          o.z -= dz;
          o.ph += wdt * 8;
          // weaving two-wheelers (later in the run)
          if (o.def.weave && !o.weaving && this.time > 40 && o.z < 50 && o.z > 32 && Math.random() < 0.6 * wdt) {
            const dir = o.lane === 0 ? (Math.random() < 0.5 ? -1 : 1) : -o.lane;
            const nl = o.lane + dir;
            if (!this.obs.some((q) => q !== o && q.state === 'live' && q.lane === nl && Math.abs(q.z - o.z) < 7)) { o.lane = nl; o.weaving = true; }
          }
          o.x += (o.lane - o.x) * (1 - Math.exp(-2.2 * wdt));
          // collision (swept along z)
          if (this.mode !== 'crash') {
            const depth = o.ground ? o.len : 0.9;
            const zHit = o.z <= pz + 0.5 && pzPrev + depth >= pz - 0.45 && o.z + depth >= pz - 0.45 - dz;
            const xHit = Math.abs(o.x - this.px) < phw + o.w * 0.4;
            if (zHit && xHit) {
              if (powered) this.smash(o);
              else if (!o.hitDone) this.crashInto(o);
            }
          }
          if (!o.passed && o.z < pz - 1) {
            o.passed = true;
            if (!o.hitDone && this.mode !== 'crash') this.addScore(C.score.avoid, undefined, undefined, false);
          }
          if (o.z < 0.8) { this.obs.splice(i, 1); continue; }
        } else { // flying debris
          o.vy -= 22 * wdt; o.h += o.vy * wdt; o.x += o.vx * wdt; o.z += (o.vz - this.speed) * wdt; o.rot += o.vr * wdt;
          if (o.h < 0 && o.vy < 0) { o.h = 0; o.vy *= -0.3; o.vx *= 0.6; o.vr *= 0.5; }
          o.alpha -= wdt * 0.9;
          if (o.alpha <= 0 || o.z < 0.8 || o.z > C.farZ + 10) { this.obs.splice(i, 1); }
        }
      }

      // ---- pickups
      const magnet = this.mode === 'power';
      for (let i = this.pick.length - 1; i >= 0; i--) {
        const p = this.pick[i];
        const prev = p.z;
        p.z -= dz; p.ph += dt * 5;
        if (magnet && p.kind === 'coin' && p.z < C.power.magnetZ && p.z > pz - 0.5) {
          p.x += (this.px - p.x) * (1 - Math.exp(-7 * dt));
          p.z -= (p.z - pz) * (1 - Math.exp(-4 * dt));
        }
        if (p.alive && this.mode !== 'crash' && prev >= pz - 0.7 && p.z <= pz + 0.7 && Math.abs(p.x - this.px) < 0.55) {
          this.collect(p); this.pick.splice(i, 1); continue;
        }
        if (p.z < 1) this.pick.splice(i, 1);
      }

      // ---- decals (zebra, flyover shadows)
      for (let i = this.decals.length - 1; i >= 0; i--) if (this.decals[i].wz - this.dist < 0.5) this.decals.splice(i, 1);

      // ---- power-mode trail
      if (powered && this.mode !== 'crash') {
        const P = this.project(this.px, pz, 0.15);
        const s = P.s;
        if (Math.random() < 0.9) this.spawnP(P.x + rand(-0.35, 0.35) * s, P.y - rand(0, 0.5) * s, rand(-30, 30), rand(60, 160), 0.45, rand(3, 7), pick(['#7fe9ff', '#ffe34a', '#ffffff']), true, 0, 'dot');
      }

      this.updateParticles(dt);
      for (const l of this.speedLines) { l.d += dt * l.v * (powered ? 2.2 : 0.9); if (l.d > 1) { l.d = 0; l.a = Math.random() * 6.283; } }
      this.sfx.tick(this.mode === 'power');
      this.updateHud();
    }
    updateParticles(dt) {
      for (const p of this.particles) {
        if (p.life <= 0) continue;
        p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.shape === 'smoke') { p.size += dt * 18; p.vx *= 0.96; p.vy *= 0.96; }
      }
      for (const f of this.floaters) if (f.life > 0) { f.life -= dt; f.y -= dt * 60; }
    }
    cullScenery() {
      const d = this.dist;
      for (let i = this.scen.length - 1; i >= 0; i--) if (this.scen[i].wz - d < 0.6) this.scen.splice(i, 1);
    }

    collect(p) {
      const P = this.project(p.x, CONFIG.playerZ, 0.55);
      if (p.kind === 'coin') {
        this.coins++;
        const showTxt = this.time - (this.lastCoinTxt || -9) > 0.22;
        if (showTxt) this.lastCoinTxt = this.time;
        this.addScore(CONFIG.score.coin, showTxt ? P.x + rand(-12, 12) : undefined, P.y - 20 - rand(0, 14), '', '#ffd23b');
        if (this.mode === 'normal') this.gainEnergy(CONFIG.power.perCoin);
        this.burst(P.x, P.y, 9, ['#ffe066', '#ffd23b', '#fff6b5'], 220, 0.5, 5, true, 300);
        this.sfx.coin();
      } else {
        this.addScore(CONFIG.score.cell, undefined, undefined, false);
        this.gainEnergy(CONFIG.power.perCell);
        this.addFloater('+' + CONFIG.power.perCell + '% ⚡', P.x, P.y - 30, '#7fe9ff', 1.1, 30);
        this.burst(P.x, P.y, 18, ['#7fe9ff', '#ffffff', '#ffe34a'], 320, 0.6, 6, true, 0);
        this.sfx.cell();
      }
    }
    gainEnergy(v) {
      if (this.mode !== 'normal' || this.ready) return;
      this.energy = clamp(this.energy + v, 0, 100);
      if (this.energy >= 100) {
        this.ready = true; this.sfx.ready();
        this.addFloater('⚡ SIMBA POWER READY', this.W / 2, this.H * 0.42, '#ffc928', 1.6, this.portrait ? 26 : 38);
      }
    }
    crashInto(o) {
      if (this.invuln > 0) { o.hitDone = true; return; }
      o.hitDone = true;
      this.health--;
      this.invuln = CONFIG.invuln;
      this.hitSlow = 1;
      this.shake = 14;
      this.energy = this.ready ? this.energy : Math.max(0, this.energy - CONFIG.power.hitPenalty);
      this.sfx.hit();
      const P = this.project(this.px, CONFIG.playerZ, 0.5);
      this.burst(P.x, P.y - 10, 22, ['#ffffff', '#ffd23b', '#ff7a3a', '#cfd4dc'], 380, 0.55, 6, true, 500);
      for (let i = 0; i < 8; i++) this.spawnP(P.x + rand(-40, 40), P.y + rand(-30, 10), rand(-60, 60), rand(-90, -30), 0.9, rand(8, 14), 'rgba(90,90,100,.5)', false, 0, 'smoke');
      this.addFloater(this.health > 0 ? 'OUCH!' : 'CRASH!', P.x, P.y - P.s * 1.1, '#ff6b6b', 0.9, 34);
      if (!o.ground) this.launch(o, 0.45);
      this.flashHud();
      if (this.health <= 0) { this.mode = 'crash'; this.crashT = 0; this.sfx.music(false); this.root.classList.remove('is-power'); }
    }
    launch(o, power) {
      o.state = 'fly';
      const side = o.x === this.px ? (Math.random() < 0.5 ? -1 : 1) : Math.sign(o.x - this.px);
      o.vx = side * rand(3, 6) * power; o.vy = rand(5, 8) * power; o.vz = this.speed + rand(8, 16) * power;
      o.vr = side * rand(4, 9) * power; o.h = 0.01;
    }
    smash(o) {
      if (o.state !== 'live') return;
      if (o.ground) { o.state = 'gone'; o.hitDone = true; o.alpha = 0; return; } // pothole – SIMBA just glides over
      this.smashed++;
      this.launch(o, 1.4);
      o.state = 'fly';
      this.shake = Math.max(this.shake, 9);
      const P = this.project(o.x, o.z, 0.4);
      this.addScore(CONFIG.score.destroy, P.x, P.y - 40, 'SMASH!', '#ffc928');
      this.burst(P.x, P.y, 26, ['#ffe34a', '#7fe9ff', '#ffffff', '#ff8a3a'], 520, 0.6, 7, true, 400);
      this.sfx.destroy();
    }
    flashHud() { this.el.cells.classList.remove('is-hit'); void this.el.cells.offsetWidth; }

    updateTransform(dt) {
      const T = CONFIG.power.transform;
      this.modeT += dt;
      const t = this.modeT;
      const P = this.project(this.px, CONFIG.playerZ, 0.6);
      const s = P.s;
      if (t < 0.95) {
        this.timeScale = lerp(this.timeScale, 0.18, dt * 6);
        this.shake = Math.max(this.shake, 2 + t * 7);
        // energy converging
        for (let i = 0; i < 3; i++) {
          const a = Math.random() * 6.283, r = rand(0.9, 1.6) * s;
          const p = this.spawnP(P.x + Math.cos(a) * r, P.y + Math.sin(a) * r * 0.7, -Math.cos(a) * r * 2.2, -Math.sin(a) * r * 1.5, 0.42, rand(3, 6), pick(['#7fe9ff', '#ffe34a', '#ffffff']), true, 0, 'spark');
          if (p) p.tx = P.x;
        }
      } else if (!this.shock) {
        // the pulse
        this.shock = { t: 0, x: P.x, y: P.y };
        this.flashA = 0.95; this.el.flash.style.opacity = '0.95';
        this.shake = 22;
        this.burst(P.x, P.y - s * 0.3, 60, ['#ffffff', '#7fe9ff', '#ffe34a'], 900, 0.8, 8, true, 0);
        // clear the road ahead
        this.obs.forEach((o) => { if (o.state === 'live' && o.z < CONFIG.playerZ + 14 && o.z > CONFIG.playerZ - 1) this.smash(o); });
        this.sfx.powerHum(true);
      } else {
        this.timeScale = lerp(this.timeScale, 1, dt * 5);
      }
      if (this.shock) this.shock.t += dt;
      if (t >= T) {
        this.mode = 'power'; this.modeT = 0; this.timeScale = 1; this.shock = null;
        this.energy = 100;
      }
    }
    endPower() {
      this.mode = 'normal'; this.modeT = 0; this.energy = 0; this.ready = false;
      this.root.classList.remove('is-power');
      this.sfx.powerHum(false);
      this.invuln = 1.2; // grace period so power-down is never punished
      const P = this.project(this.px, CONFIG.playerZ, 0.5);
      this.burst(P.x, P.y, 24, ['#7fe9ff', '#9ca3af', '#ffffff'], 260, 0.7, 5, true, 0);
      this.addFloater('POWER DOWN', this.W / 2, this.H * 0.42, '#7fe9ff', 1.1, this.portrait ? 24 : 32);
    }

    /* ---------------- HUD (DOM, written only on change) ---------------- */
    updateHud(force) {
      const c = this.hudCache;
      const sc = String(Math.floor(this.score)).padStart(4, '0');
      if (force || c.sc !== sc) { this.el.score.textContent = sc; c.sc = sc; }
      if (force || c.hp !== this.health) {
        this.el.cellEls.forEach((e, i) => e.classList.toggle('is-empty', i >= this.health));
        this.el.cells.classList.toggle('is-low', this.health === 1);
        c.hp = this.health;
      }
      let frac, label;
      if (this.mode === 'power') { frac = 1 - this.modeT / CONFIG.power.duration; label = Math.ceil(CONFIG.power.duration - this.modeT) + 's'; }
      else if (this.mode === 'transform') { frac = 1; label = '100%'; }
      else { frac = this.energy / 100; label = Math.round(this.energy) + '%'; }
      const fq = Math.round(frac * 200) / 200;
      if (force || c.fq !== fq) { this.el.fill.style.transform = 'scaleX(' + fq + ')'; this.el.tFill.style.height = (fq * 100) + '%'; c.fq = fq; }
      if (force || c.label !== label) { this.el.pct.textContent = label; c.label = label; }
      const st = this.ready ? 'ready' : (this.mode === 'power' || this.mode === 'transform') ? 'active' : 'idle';
      if (force || c.st !== st) {
        this.el.power.classList.toggle('is-ready', st === 'ready');
        this.el.power.classList.toggle('is-active', st === 'active');
        this.el.tPower.classList.toggle('is-ready', st === 'ready');
        c.st = st;
      }
    }

    /* ---------------- render ---------------- */
    render() {
      const ctx = this.ctx, W = this.W, H = this.H, dpr = this.dpr;
      if (!this.spr || !W || this.state === 'loading') return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sh = this.shake;
      const ox = sh ? rand(-sh, sh) * 0.6 : 0, oy = sh ? rand(-sh, sh) * 0.6 : 0;
      ctx.save();
      ctx.translate(ox, oy);
      this.drawSky();
      this.drawRoad();
      this.drawWorld();
      ctx.restore();
      this.drawFx();
    }

    drawSky() {
      const ctx = this.ctx, W = this.W, hy = this.hy, t = this.theme;
      const g = ctx.createLinearGradient(0, -20, 0, hy);
      g.addColorStop(0, t.skyTop); g.addColorStop(0.55, t.skyMid); g.addColorStop(1, t.skyLow);
      ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, hy + 32);
      // sun
      const sx = W * 0.78 - this.camX * 10, sy = hy * 0.42;
      ctx.drawImage(this.spr.glowWhite, sx - hy * 0.5, sy - hy * 0.5, hy, hy);
      ctx.fillStyle = t.sun; ctx.beginPath(); ctx.arc(sx, sy, hy * 0.09, 0, 6.283); ctx.fill();
      // kites
      const time = this.time;
      for (const k of this.kites) {
        const kx = (k.x * W + Math.sin(time * 0.4 + k.ph) * 20 - this.camX * 6), ky = k.y * hy * 2 + Math.cos(time * 0.7 + k.ph) * 8;

      const ey = top + len * 0.5, er = Math.min(w * 0.16, len * 0.36);
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 * k;
      ctx.drawImage(this.spr.glowGold, -er * 2, ey - er * 2, er * 4, er * 4);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = k;
      ctx.beginPath(); ctx.arc(0, ey, er, 0, 6.283); ctx.fillStyle = '#ffc928'; ctx.fill();
      ctx.lineWidth = Math.max(1.5, w * 0.01); ctx.strokeStyle = '#1B3A62'; ctx.stroke();
      ctx.fillStyle = '#1B3A62'; boltPath(ctx, 0, ey, er * 1.55); ctx.fill();
      ctx.restore();
    }
    drawArcs(cx, cy, rx, ry, n) {
      const ctx = this.ctx;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        if (Math.random() < 0.35) continue;
        const a0 = Math.random() * 6.283, a1 = a0 + rand(0.5, 1.4);
        ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(127,233,255,.9)' : 'rgba(255,240,140,.9)';
        ctx.lineWidth = rand(1.2, 2.6);
        ctx.beginPath();
        const segs = 6;
        for (let s = 0; s <= segs; s++) {
          const a = lerp(a0, a1, s / segs), j = s === 0 || s === segs ? 0 : rand(-0.12, 0.12);
          const xx = cx + Math.cos(a) * rx * (1 + j), yy = cy + Math.sin(a) * ry * (1 + j);
          if (s === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    drawFx() {
      const ctx = this.ctx, W = this.W, H = this.H;
      const powered = this.mode === 'power' || this.mode === 'transform';
      // speed lines
      if (this.state === 'playing' && (powered || this.speed > 24)) {
        const vx = W / 2, vy = this.hy;
        const amt = powered ? 1 : clamp((this.speed - 24) / 10, 0, 0.5);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = powered ? 'rgba(160,235,255,.35)' : 'rgba(255,255,255,.18)';
        ctx.lineWidth = powered ? 2 : 1.4;
        ctx.beginPath();
        const R = Math.hypot(W, H);
        for (let i = 0; i < this.speedLines.length * amt; i++) {
          const l = this.speedLines[i];
          const d0 = 0.25 + l.d * 0.75, d1 = d0 + 0.12;
          const c = Math.cos(l.a), s = Math.sin(l.a);
          ctx.moveTo(vx + c * d0 * R, vy + s * d0 * R * 0.7); ctx.lineTo(vx + c * d1 * R, vy + s * d1 * R * 0.7);
        }
        ctx.stroke(); ctx.restore();
      }
      // particles
      for (const p of this.particles) {
        if (p.life <= 0) continue;
        const k = p.life / p.max;
        if (p.add) ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = p.shape === 'smoke' ? k * 0.8 : Math.min(1, k * 1.4);
        ctx.fillStyle = p.color;
        if (p.shape === 'spark') { ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.shape === 'smoke' ? p.size : p.size * (0.4 + k * 0.6), 0, 6.283); ctx.fill(); }
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalAlpha = 1;
      // shockwave
      if (this.shock) {
        const t = this.shock.t, r = easeOut(clamp(t / 0.45, 0, 1)) * Math.max(W, H) * 0.8;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(127,233,255,' + clamp(1 - t / 0.45, 0, 1) + ')';
        ctx.lineWidth = 18 * (1 - clamp(t / 0.45, 0, 1)) + 2;
        ctx.beginPath(); ctx.ellipse(this.shock.x, this.shock.y - 30, r, r * 0.55, 0, 0, 6.283); ctx.stroke(); ctx.restore();
      }
      // transformation vignette + title
      if (this.mode === 'transform' || this.mode === 'power') {
        const k = this.mode === 'transform' ? clamp(this.modeT / 0.5, 0, 1) : clamp(1 - Math.max(0, this.modeT - (CONFIG.power.duration - 0.6)) / 0.6, 0, 1);
        const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.8);
        vg.addColorStop(0, 'rgba(27,58,98,0)'); vg.addColorStop(1, 'rgba(27,58,98,' + (0.55 * k) + ')');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
        // power ending warning
        if (this.mode === 'power' && this.modeT > CONFIG.power.duration - 2 && ((this.modeT * 6) | 0) % 2) {
          ctx.fillStyle = 'rgba(219,33,42,.12)'; ctx.fillRect(0, 0, W, H);
        }
      }
      if (this.mode === 'transform' && this.modeT > 0.2) {
        const t = this.modeT;
        const appear = easeOut(clamp((t - 0.2) / 0.35, 0, 1));
        const out = clamp((t - 1.25) / 0.25, 0, 1);
        const size = Math.min(W * 0.11, H * 0.14) * (0.6 + appear * 0.4 + out * 0.4);
        const y = H * (this.isTouch && this.portrait ? 0.24 : 0.3);
        ctx.save(); ctx.globalAlpha = appear * (1 - out);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '800 ' + size + 'px "Baloo 2", "Trebuchet MS", sans-serif';
        ctx.lineWidth = size * 0.14; ctx.strokeStyle = '#1B3A62'; ctx.lineJoin = 'round';
        ctx.strokeText('SIMBA POWER!', W / 2, y); ctx.fillStyle = '#ffc928'; ctx.fillText('SIMBA POWER!', W / 2, y);
        const hero = this.img && this.img.simba_hero_mode;
        if (hero && t > 0.95) {
          const hh = size * 2.2, hw = hh * hero.width / hero.height, k = easeOut(clamp((t - 0.95) / 0.2, 0, 1));
          ctx.globalAlpha = k * (1 - out);
          ctx.drawImage(hero, W / 2 - hw / 2, y - size * 0.6 - hh * k, hw, hh);
        }
        ctx.restore();
      }
      // floaters
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const f of this.floaters) {
        if (f.life <= 0) continue;
        const k = f.life / f.max, pop = 1 + Math.max(0, (k - 0.85)) * 3;
        ctx.globalAlpha = Math.min(1, k * 2);
        const sz = f.size * pop * (this.W < 500 ? 0.8 : 1);
        ctx.font = '800 ' + sz + 'px "Baloo 2", "Trebuchet MS", sans-serif';
        ctx.lineWidth = sz * 0.16; ctx.strokeStyle = 'rgba(15,36,64,.85)'; ctx.lineJoin = 'round';
        ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, f.y);
      }
      ctx.globalAlpha = 1;
      // low-health red edge
      if (this.state === 'playing' && this.health === 1 && this.mode === 'normal') {
        const a = 0.18 + Math.sin(this.time * 6) * 0.08;
        const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
        vg.addColorStop(0, 'rgba(219,33,42,0)'); vg.addColorStop(1, 'rgba(219,33,42,' + a + ')');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      }
    }
  }

  /* =====================================================================
   * PUBLIC API
   * ===================================================================== */
  const SimbaRush = {
    CONFIG, THEMES, OBSTACLES,
    mount(el, opts) {
      if (typeof el === 'string') el = document.querySelector(el);
      if (!el) throw new Error('SimbaRush: container not found');
      if (el.__simba) return el.__simba;
      const g = new Game(el, opts);
      el.__simba = g;
      return g;
    }
  };
  global.SimbaRush = SimbaRush;

  function auto() {
    document.querySelectorAll('[data-simba-rush]').forEach((el) => SimbaRush.mount(el, { assets: el.getAttribute('data-assets') || 'assets/' }));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', auto); else auto();
})(window);

</script>
</body>
</html>
